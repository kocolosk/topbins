name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check scaffold
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: "2026.9.12"
          install_args: "--locked node conda:ffmpeg conda:exiftool"
      - run: mise run setup
      - run: mise exec -- npm run doctor
      - run: mise run check
      - run: git diff --exit-code
